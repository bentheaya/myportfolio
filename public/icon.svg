<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark background rounded square -->
  <rect width="180" height="180" rx="38" fill="#080808"/>

  <!-- Constellation: three nodes connected by lines — matches portfolio's R3F HeroScene motif -->
  <!-- Lines (edges) -->
  <line x1="50" y1="130" x2="90" y2="52" stroke="#2dd4a0" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="90" y1="52" x2="130" y2="130" stroke="#2dd4a0" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="50" y1="130" x2="130" y2="130" stroke="#2dd4a0" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>

  <!-- Central accent bridge -->
  <line x1="90" y1="52" x2="90" y2="130" stroke="#2dd4a0" stroke-width="1" stroke-linecap="round" opacity="0.25" stroke-dasharray="3 4"/>

  <!-- Nodes (vertices) -->
  <!-- Top node – primary / active -->
  <circle cx="90" cy="52" r="8" fill="#2dd4a0"/>
  <circle cx="90" cy="52" r="13" fill="#2dd4a0" opacity="0.15"/>

  <!-- Bottom-left node -->
  <circle cx="50" cy="130" r="5.5" fill="#2dd4a0" opacity="0.8"/>
  <circle cx="50" cy="130" r="10" fill="#2dd4a0" opacity="0.1"/>

  <!-- Bottom-right node -->
  <circle cx="130" cy="130" r="5.5" fill="#2dd4a0" opacity="0.8"/>
  <circle cx="130" cy="130" r="10" fill="#2dd4a0" opacity="0.1"/>
</svg>